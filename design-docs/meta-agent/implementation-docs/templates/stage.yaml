# ============================================================
# stage.yaml — Agent Stage Template (Blank)
# ============================================================
# Canonical specification of one agent stage.
# Top-level sections: stage, input, output, processing, error_strategy, performance.
# ============================================================

stage:
  id: "stage_unique_id"                        # [REQUIRED] Matches pipeline.stages[].stage_id in agent.yaml
  name: "Human Readable Stage Name"            # [REQUIRED] Display name for logging & telemetry
  type: "reasoning"                            # [REQUIRED] discovery | reasoning | code_generation | sandbox_testing | human_review | delivery | custom
  description: >                               # [REQUIRED] What this stage does (WHAT, not HOW)
    Plain English description of stage responsibility.
  autonomy: "autonomous"                       # [REQUIRED] autonomous | semi_autonomous | human_required

input:
  contract: "input_contract_name"              # [REQUIRED for non-initial] References contracts/<name>.yaml
  source:                                      # [OPTIONAL] External connection if initial stage
    type: "database"                           # database | catalog | git | api | file
    uri: "${config.sources.primary_db.uri}"

output:
  contract: "output_contract_name"             # [REQUIRED for non-terminal] References contracts/<name>.yaml
  destination:                                 # [OPTIONAL] External target if terminal stage
    type: "git"                                # git | catalog | database | api | file
    uri: "${config.destinations.target_repo.uri}"

processing:
  processing_type: "llm_reasoning"             # [REQUIRED] llm_reasoning | deterministic_tool | human_gate
  llm_config:                                  # [REQUIRED if processing_type is llm_reasoning]
    model_tier: "reasoning"                    # speed | reasoning | heavy
    prompt_template_ref: "prompts/prompt.jinja2" # Path to Jinja2 prompt template
    output_schema: "output_contract_name"      # Instructor Pydantic contract name
    temperature: 0.0                           # Sampling temperature
    max_tokens: 4096                           # Token generation limit
    cost_cap_usd: 0.50                         # Cost ceiling in USD
  tools:                                       # [OPTIONAL] Agentic tools bound to this stage
    - name: "tool_name"
      type: "builtin"                          # builtin | custom_code | shared_component
      handler: null                            # [OPTIONAL for custom_code] Hook synthesized by Leaf Coder: tools/<mod>.py::<func>
      signature: null                          # [OPTIONAL for custom_code] Explicit typed signature: (arg: type) -> return_type
      purpose: "Why this tool is called by LLM or stage runner"
      access: "read_only"                      # read_only | side_effecting
      requires_approval: false                 # Whether invoking tool triggers human approval gate
      configuration: {}
  safety_valves:                               # [OPTIONAL] Loop bounds and timeout controls
    max_tool_iterations: 5                     # Max tool calling iterations in ReAct loop
    max_reflection_retries: 3                  # Max self-correction retries on compilation/lint error
    timeout_seconds: 300                       # Stage hard timeout
  logic_description: >                         # [OPTIONAL] Algorithmic description projected to Leaf Coder or stage node logic
    Step-by-step description of transformations, rules, and logic.

error_strategy:
  on_error:                                    # [REQUIRED] Default or scenario-keyed error handlers
    action: "retry"                            # retry | fail | skip | escalate | reflect
    max_retries: 3
    retry_delay_seconds: 30
    escalation: "fail"

performance:
  expected_duration_seconds: 30
  timeout_seconds: 120
