# ============================================================
# agent.yaml — Agent Manifest Template (Blank)
# ============================================================
# The top-level identity and architecture declaration for a DDLC agent.
# The Builder reads this file first to determine the generation strategy.
# ============================================================

agent:
  name: "agent_unique_identifier"              # [REQUIRED] Snake_case identifier (e.g., telemetry_anomaly_detector)
  display_name: "Human Readable Name"          # [REQUIRED] Display title in UI & catalog
  version: "1.0.0"                             # [REQUIRED] Semantic version
  description: >                               # [REQUIRED] Clear statement of agent business purpose and scope
    High-level description of what this agent does.
  owner: "team_or_individual_owner"            # [REQUIRED] Owning engineering or business group
  tags:                                        # [OPTIONAL] Metadata catalog tags
    - "domain_tag"

architecture:
  pattern: "stateful_pipeline_with_gates"      # [REQUIRED] Pattern: simple_pipeline | stateful_pipeline_with_gates | batch_processor | streaming_processor | multi_source_aggregator
  runtime: "langgraph"                         # [REQUIRED] Runtime: langgraph | python_pipeline | streaming
  autonomy_level: "semi_autonomous"            # [REQUIRED] Autonomy: autonomous | semi_autonomous | human_required

pipeline:
  stages:                                      # [REQUIRED] Ordered stage topology
    - stage_id: "stage_1_id"                   # References stages/stage_<id>.yaml
      next: "stage_2_id"
    - stage_id: "stage_2_id"
      next: null                               # Terminal stage

dependencies:
  tools:                                       # [OPTIONAL] External tools and libraries
    - name: "tool_name"
      version: ">=1.0.0"
      used_by: ["stage_1_id"]
      description: "Purpose of tool"
  shared_components:                           # [OPTIONAL] Reusable Tier 2 components
    - name: "shared_component_name"
      version: "1.0.0"
      used_by: ["stage_1_id"]
      usage_type: "import"                     # import | extend | wrap
      description: "Component capability"
