# Alembic Configuration for DDLC Agent Studio
# DCM Schema Engine — multi-schema migration management

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Truncate slug to this length
truncate_slug_length = 60

# Set to 'true' to run environment during 'alembic revision'
revision_environment = false

# Database URL — overridden programmatically by DCM CLI via DCM_MIGRATION_DB_URI
# sqlalchemy.url is set dynamically; this placeholder prevents Alembic from complaining.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
