services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ddlc-studio-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_ddlc_agent_studio}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-ddlc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-ddlc_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - ddlc_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER:-ddlc_admin} -d ${POSTGRES_DB:-db_ddlc_agent_studio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ddlc_postgres_data:
